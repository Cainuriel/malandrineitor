<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>¡MALANDRINEITOR! — Malandriner S.A.</title>
  <meta name="description" content="Juego de cartas homenaje a la comunidad de Web Reactiva. Malandriner S.A., especialistas en todo tipo de software.">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
<!-- Filtros de las quemaduras de carta (modo historia). Deforman los círculos del
     chamuscado con ruido fractal para que el borde no sea un arco perfecto.
     Tres semillas para que dos cartas quemadas no salgan calcadas. -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <filter id="mi-quemadura-1" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" seed="7" result="r"/>
    <feDisplacementMap in="SourceGraphic" in2="r" scale="14" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="mi-quemadura-2" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.062" numOctaves="4" seed="23" result="r"/>
    <feDisplacementMap in="SourceGraphic" in2="r" scale="16" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="mi-quemadura-3" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.042" numOctaves="5" seed="41" result="r"/>
    <feDisplacementMap in="SourceGraphic" in2="r" scale="12" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
  <div id="app">
    <header class="topbar">
      <a class="brand" href="#menu">
        <span class="logo">¡MALANDRINEITOR!</span>
        <span class="company">Malandriner S.A.</span>
      </a>
      <nav class="nav">
        <button data-view="menu">Inicio</button>
        <button data-view="story">Historia</button>
        <button data-view="game">Arcade</button>
        <button data-view="album">Álbum</button>
        <button data-view="rules">Normas</button>
        <button data-view="perfil">Perfil</button>
      </nav>
    </header>
    <main id="view" class="view"></main>
    <footer class="site-footer">
      <div class="footer-stamp" aria-hidden="true">PRIVACIDAD: OK</div>
      <div class="footer-copy">
        <p class="footer-signature">Made with love by <a href="https://cainuriel.github.io/" target="_blank" rel="noopener noreferrer">Fernando López</a></p>
        <p>Este sitio usa <span class="mono">localStorage</span> como base de datos. No usamos cookies ni capturamos ninguna información del usuario.</p>
      </div>
      <div class="footer-links">
        <strong>Amamos la privacidad</strong>
        <a href="https://github.com/Cainuriel/malandrineitor" target="_blank" rel="noopener noreferrer">GitHub del proyecto</a>
      </div>
    </footer>
  </div>

  <!-- Datos (orden libre entre ellos) -->
  <script src="data/config.js"></script>
  <script src="data/skills.js"></script>
  <script src="data/techs.js"></script>
  <script src="data/cards.js"></script>
  <script src="data/challenges.js"></script>
  <script src="data/optout.js"></script>
  <script src="data/phrases.js"></script>
  <!-- Motor y vistas (este orden importa) -->
  <script src="js/util.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/match.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/card.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/album.js"></script>
  <script src="js/game.js"></script>
  <script src="js/story.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
